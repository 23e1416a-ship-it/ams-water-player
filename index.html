<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水のつぶの動きを見てみよう</title>
<style>
:root{--bg:#eef6fb;--panel:#fff;--text:#17324a;--muted:#5b7183;--line:#c8d9e5;--accent:#0878bd;--accent2:#eaf7ff;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Yu Gothic UI","Meiryo",sans-serif}main{max-width:1380px;margin:auto;padding:14px}h1{font-size:clamp(1.3rem,3vw,2rem);margin:4px 0 14px;text-align:center}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(23,50,74,.06)}.condition{border:3px solid #78bce5;background:linear-gradient(180deg,#fff,#f5fbff);margin-bottom:12px}.condition-grid{display:grid;grid-template-columns:repeat(2,minmax(180px,1fr)) auto;gap:12px;align-items:end}@media(max-width:760px){.condition-grid{grid-template-columns:1fr}}label{display:grid;gap:6px;font-weight:700}select,button,input{font:inherit;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--text);min-height:46px}select{font-size:1.05rem}button{cursor:pointer;font-weight:800}button:disabled{opacity:.48;cursor:not-allowed}.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-size:1.05rem}.controls{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:12px}.controls button{min-width:100px}.status{margin:10px 0;padding:12px 14px;border-radius:12px;background:var(--accent2);font-weight:700;white-space:pre-wrap}.status.error{background:#fdeaea;color:var(--danger)}.grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}.canvas-wrap{width:100%;aspect-ratio:16/9;background:#fff;border:2px solid #1f2937;border-radius:12px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.timeline-row{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;margin-top:10px}.timeline-row input{width:100%;padding:0;min-height:32px}.md-time{margin:5px 0 0;text-align:center;font-weight:800;color:#075f93;font-variant-numeric:tabular-nums}details{margin-top:10px;border-top:1px solid var(--line);padding-top:10px}summary{cursor:pointer;font-weight:800}dl{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:.9rem}dt{color:var(--muted)}dd{margin:0;text-align:right}.note{font-size:.88rem;color:var(--muted);line-height:1.6}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dff2ff;color:#075f93;font-size:.82rem;font-weight:800}
</style>
</head>
<body>
<main>
<h1>水のつぶの動きを見てみよう</h1>
<section class="panel condition" aria-label="条件を選ぶ">
<div class="condition-grid">
<label>① 食塩の結晶の大きさ
<select id="formulaUnits">
<option value="1">1式単位</option><option value="2">2式単位</option><option value="3">3式単位</option><option value="4">4式単位</option><option value="6">6式単位</option><option value="8">8式単位</option>
</select>
</label>
<label>② 水分子の数
<select id="waterCount">
<option value="36">36分子</option><option value="64">64分子</option><option value="100">100分子</option>
</select>
</label>
<button id="reload" class="primary" type="button">③ この条件を見る</button>
</div>
</section>
<section class="panel controls" aria-label="再生操作">
<button id="play" class="primary" type="button" disabled>再生</button>
<button id="first" type="button" disabled>最初にもどる</button>
<button id="center" type="button" disabled>表示をもどす</button>
<span class="badge">画面をドラッグ、ホイールで拡大</span>
<details>
<summary>表示の設定</summary>
<div class="controls">
<label>速さ<select id="speed"><option value=".25">ゆっくり</option><option value=".5">0.5倍</option><option value="1" selected>ふつう</option><option value="2">2倍</option><option value="4">4倍</option></select></label>
<label><span><input id="hydration" type="checkbox" checked> 水和水を青くする</span></label>
<label><span><input id="bonds" type="checkbox" checked> 水分子の線を表示</span></label>
</div>
</details>
</section>
<div id="status" class="status" role="status" aria-live="polite">データを読み込んでいます…</div>
<div class="grid">
<section class="panel">
<div class="canvas-wrap"><canvas id="canvas"></canvas></div>
<div class="timeline-row"><strong id="frameLabel">0 / 0</strong><input id="timeline" type="range" min="0" max="0" value="0" disabled aria-label="再生位置"></div>
<p id="mdElapsedTime" class="md-time" aria-live="polite">MD経過時間：-</p>
</section>
<aside class="panel">
<h2>選んだ条件</h2><dl id="meta"><dt>状態</dt><dd>読込中</dd></dl>
<h2>いまのようす</h2><dl id="metrics"><dt>step</dt><dd>-</dd></dl>
<p id="warning" class="note">データ読込後に表示します。</p>
</aside>
</div>
</main>
<script src="ams_trajectory_catalog_child_v13.js"></script>
</body>
</html>
