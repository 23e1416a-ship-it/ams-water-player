<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMS条件選択式軌道再生 v10</title>
<style>
:root{--bg:#eef3f8;--panel:#fff;--text:#172033;--muted:#59677d;--line:#cbd5e1;--accent:#1769aa;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1380px;margin:auto;padding:16px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.toolbar{display:flex;flex-wrap:wrap;gap:9px;align-items:end;margin-bottom:12px}.condition{border:2px solid #76a8cc;background:#f8fcff}.grid{display:grid;grid-template-columns:minmax(320px,1fr) 330px;gap:16px}@media(max-width:860px){.grid{grid-template-columns:1fr}}label{display:grid;gap:4px;font-size:.86rem;color:var(--muted)}input,select,button{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--text)}button{cursor:pointer}button:disabled{opacity:.45}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.canvas-wrap{width:100%;aspect-ratio:16/9;background:#fff;border:1px solid #c8d1dc;border-radius:10px;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}.row{display:flex;gap:8px;align-items:center}.row input{width:100%}.status{margin:8px 0;color:var(--muted);white-space:pre-wrap}.error{color:var(--danger)}dl{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:.9rem}dt{color:var(--muted)}dd{margin:0;text-align:right}.note{font-size:.84rem;color:var(--muted);line-height:1.55}h1{font-size:1.25rem;margin:0 0 12px}h2{font-size:1rem;margin:15px 0 7px}
</style>
</head>
<body>
<main>
<h1>AMS 条件選択式JSON軌道再生プレイヤー v10</h1>
<section class="panel toolbar condition" aria-label="事前計算条件">
<label>NaCl式単位数
<select id="formulaUnits"><option>1</option><option>2</option><option>3</option><option>4</option><option>6</option><option>8</option></select>
</label>
<label>水分子数・三層内訳
<select id="waterCount"><option value="36">36（12-12-12）</option><option value="64">64（25-25-14）</option><option value="100">100（34-34-32）</option></select>
</label>
<label>JSONフォルダを選択（一度だけ）
<input id="folder" type="file" webkitdirectory directory multiple accept=".json,application/json">
</label>
<button id="reload" type="button">選択条件を読み込む</button>
<label><span>自動再生</span><span><input id="autoPlay" type="checkbox"> 読込後に開始</span></label>
<details><summary>手動ファイル読込</summary><input id="manualFile" type="file" accept=".json,application/json"></details>
</section>
<section class="panel toolbar">
<button id="play" class="primary" disabled>再生</button><button id="first" disabled>先頭へ</button><button id="center" disabled>表示を初期位置へ</button>
<label>速度<select id="speed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option><option value="4">4倍</option></select></label>
<label><span>水和水</span><span><input id="hydration" type="checkbox" checked> 青色・補助線</span></label>
<label><span>結合線</span><span><input id="bonds" type="checkbox" checked> 表示</span></label>
</section>
<div id="status" class="status" aria-live="polite">条件に対応するJSONを確認中です。</div>
<div class="grid">
<section class="panel"><div class="canvas-wrap"><canvas id="canvas"></canvas></div><div class="row"><span id="frameLabel">0 / 0</span><input id="timeline" type="range" min="0" max="0" value="0" disabled></div></section>
<aside class="panel"><h2>計算条件</h2><dl id="meta"><dt>状態</dt><dd>未読込</dd></dl><h2>現在フレーム</h2><dl id="metrics"><dt>step</dt><dd>-</dd></dl><h2>使用方法</h2><p class="note">18個のJSONをこのHTMLと同じフォルダに置き、HTMLをWebサーバー経由で開くと条件変更だけで自動読込します。HTMLを直接開く場合は「JSONフォルダを選択」でフォルダを一度指定してください。その後は条件変更だけで自動的に対応データを読み込みます。</p><h2>注意</h2><p id="warning" class="note">データ読込後に表示します。</p></aside>
</div>
</main>
<script src="ams_trajectory_catalog_v10.js"></script>
</body>
</html>
